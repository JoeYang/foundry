server {
  listen 80;
  server_name _;

  # Defer upstream DNS resolution so nginx starts even when "api" is not
  # resolvable (e.g. standalone smoke-test without compose network).
  # In compose the embedded DNS server is always 127.0.0.11.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /v1/ {
    set $upstream http://api:5380;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /mcp/ {
    set $upstream http://api:5380;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
