server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: any unknown path returns index.html so React Router takes over
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy api requests to the api container by compose service name.
  # Static proxy_pass (no resolver + variable trick) works because compose
  # depends_on: service_healthy guarantees api is up before web starts.
  # This is compatible with both Docker and Podman networks.
  location /v1/ {
    proxy_pass http://api:5380;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /mcp/ {
    proxy_pass http://api:5380;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # Long cache for hashed assets (Vite outputs hashed filenames in /assets)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
